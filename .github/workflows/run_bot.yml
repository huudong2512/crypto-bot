name: Run Sentiment Bot

on:
  workflow_dispatch: # Cho phép bạn bấm nút "Run workflow" chạy bằng tay
  schedule:
    - cron: '0 */4 * * *' # Tự động chạy mỗi 4 tiếng (Tuỳ chọn, có thể xoá nếu chỉ muốn chạy bằng tay)

jobs:
  build:
    runs-on: ubuntu-latest # Chạy trên máy chủ Linux của GitHub

    steps:
      # 1. Kéo code của bạn từ repo về máy chủ ảo
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Cài đặt Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Dùng bản Python ổn định

      # 3. Cài đặt thư viện requests
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Chạy file Bot (Thêm -u để hiển thị log ngay lập tức)
      - name: Execute Bot
        run: python -u sentiment_bot.py
