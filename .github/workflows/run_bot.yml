name: Wyckoff 2.0 Scanner

on:
  schedule:
    - cron: '*/15 * * * *' # Quét mỗi 15 phút (báo ngay nếu có kèo, và gửi tổng hợp mỗi 4H)
  workflow_dispatch:       # Cho phép bấm nút "Run workflow" chạy thử ngay lập tức

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests numpy pandas

      - name: Run Wyckoff Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Bỏ dấu # ở dòng dưới nếu muốn mỗi lần chạy đều gửi bảng tổng hợp
          # FORCE_REPORT: "1"
        run: python sentiment_bot.py
