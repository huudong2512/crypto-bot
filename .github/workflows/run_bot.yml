name: Run Crypto Sentiment Bot

on:
  schedule:
    # Hẹn giờ chạy tự động 4 lần/ngày (lúc 01:00, 07:00, 13:00, 19:00 UTC)
    - cron: '0 1,7,13,19 * * *'
  workflow_dispatch: # Cho phép bấm nút "Run workflow" để chạy thủ công bất kỳ lúc nào

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Execute Bot
        run: python sentiment_bot.py
